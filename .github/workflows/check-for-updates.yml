name: Check for match updates

on:
  schedule:
    # Every 5 minutes during typical match-finishing windows (13:00–22:59 UTC).
    # Covers both GMT and BST kickoff times for English football:
    #   - Early Saturday (12:30 BST → finishes ~13:15 UTC)
    #   - Standard 15:00 → finishes ~16:45
    #   - Evening midweek (19:45–20:00 → finishes ~21:30–21:45)
    - cron: "*/5 13-22 * * *"
  workflow_dispatch: # Allow manual testing

permissions:
  actions: write # Required to trigger the deploy workflow
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .match-state.json
          key: match-state-
          restore-keys: match-state-

      - id: check
        run: pnpm check-for-updates
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .match-state.json
          key: match-state-${{ github.run_id }}

      - if: steps.check.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
